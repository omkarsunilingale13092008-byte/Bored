name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: echo "" | base64 -d | gunzip | bash
      - uses: actions/upload-artifact@v4
        with:
          name: Painted-Valley-MotoG45-APK
          path: Painted-Valley-MotoG45.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Painted Valley APK Build ${{ github.run_number }}
          files: Painted-Valley-MotoG45.apk
          
