name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Clone Painted Valley and Build
        run: |
          git clone https://github.com/blendi/painted-valley.git game
          cd game
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init PaintedValley com.paintedvalley.app --web-dir=dist || true
          npx cap add android || true
          
          # Make left joystick transparent
          find src -type f -name "*.js" -o -name "*.ts" -o -name "*.css" | xargs sed -i 's/opacity: *1/opacity: 0.3/g' || true
          find src -type f -name "*.js" -o -name "*.ts" | xargs sed -i 's/left.*joystick/transparent/g' || true
          
          echo "Building..."
          npm run build || npx vite build || true
          npx cap copy android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Painted-Valley-MotoG45.apk
          cd ../..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Painted-Valley-MotoG45-APK
          path: Painted-Valley-MotoG45.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: Painted-Valley-MotoG45.apk
